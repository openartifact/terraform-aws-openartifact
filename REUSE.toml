version = 1
SPDX-PackageName = "terraform-aws-openartifact"
SPDX-PackageSupplier = "The OpenArtifact Authors"
SPDX-PackageDownloadLocation = "https://github.com/openartifact/terraform-aws-openartifact"

# Provider lock files are generated by `terraform init`; they cannot carry a header.
[[annotations]]
path = [
  "**/.terraform.lock.hcl",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The OpenArtifact Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Vendored skill: antonbabenko/terraform-skill (Apache-2.0), kept unmodified.
# See .agents/skills/README.md.
[[annotations]]
path = ".agents/skills/terraform-skill/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Anton Babenko"
SPDX-License-Identifier = "Apache-2.0"

# Vendored skills: hashicorp/agent-skills (MPL-2.0), kept unmodified. Files that
# carry their own SPDX header keep it ("closest").
[[annotations]]
path = [
  ".agents/skills/terraform-style-guide/**",
  ".agents/skills/terraform-test/**",
  ".agents/skills/terraform-policy/**",
  ".agents/skills/refactor-module/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "Copyright IBM Corp. 2026"
SPDX-License-Identifier = "MPL-2.0"
