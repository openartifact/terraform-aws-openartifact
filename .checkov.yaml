# Run with: checkov --config-file .checkov.yaml
# Suppress a finding only inline, next to the resource, with a justification:
#   #checkov:skip=CKV_AWS_xxx: reason
# Do not add a `skip-check:` list here unless every entry carries its own comment.
directory:
  - .
framework:
  - terraform
skip-path:
  - ".agents"
  - ".tofu"
  - ".*/\\.terraform/.*"
soft-fail: false
compact: true
quiet: true
download-external-modules: false
