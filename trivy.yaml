# Trivy configuration for the misconfiguration scan: `trivy config --config trivy.yaml .`
# Findings are suppressed only inline (`#trivy:ignore:AVD-AWS-xxxx` + justification),
# never with a blanket ignore file.
scan:
  scanners:
    - misconfig
  skip-dirs:
    - "**/.terraform"
    - ".tofu"
    - ".agents"
severity:
  - HIGH
  - CRITICAL
exit-code: 1
