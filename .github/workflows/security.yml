name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly: new rules and advisories without a code change
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHECKOV_VERSION: 3.4.3

jobs:
  trivy:
    name: trivy config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    env:
      # Fork PRs and Dependabot runs get a read-only token: scan and gate, skip the upload.
      CAN_UPLOAD_SARIF: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy config scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"

      - name: Upload SARIF
        if: ${{ !cancelled() && env.CAN_UPLOAD_SARIF == 'true' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Trivy config gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    env:
      CAN_UPLOAD_SARIF: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install checkov
        run: pip install --disable-pip-version-check "checkov==${CHECKOV_VERSION}"

      # Writes checkov-results/results_sarif.sarif (single output format => a directory).
      - name: checkov (SARIF)
        run: checkov --config-file .checkov.yaml --output sarif --output-file-path checkov-results --soft-fail

      # Checkov writes inline #checkov:skip results as suppressed warnings, and code scanning
      # opens an alert for each of them. The skips are justified in the source; upload only
      # real findings.
      - name: Drop suppressed results from SARIF
        run: |
          jq '.runs |= map(.results |= map(select(.suppressions == null)))' \
            checkov-results/results_sarif.sarif > checkov-results/filtered.sarif
          mv checkov-results/filtered.sarif checkov-results/results_sarif.sarif

      - name: Upload SARIF
        if: ${{ !cancelled() && env.CAN_UPLOAD_SARIF == 'true' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov

      - name: checkov gate (fail on any finding)
        run: checkov --config-file .checkov.yaml --output cli
